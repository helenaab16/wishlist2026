<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helena's Christmas Village</title>
<style>
  :root{--night:#0f1a33;--wood:#5a3a22;--snow:#eef4ff;--cream:#fff4d6;--ink:#2a1a12;--red:#b3261e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#1d2b52,var(--night) 70%);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
  h1{margin:18px 12px 4px;text-align:center;font-weight:normal;font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:.03em}
  .sub{text-align:center;margin:0 12px 14px;opacity:.8;font-style:italic}
  .mantle{position:relative;max-width:1000px;margin:0 auto 24px;border:16px solid #5a3a22;border-image:linear-gradient(135deg,#8a5a34,#4a2e1a 40%,#7a4e2c 70%,#3a2414) 1;box-shadow:0 0 0 3px #3a2414,0 20px 50px #0008;overflow:hidden;background:#0b1430}
  svg{display:block;width:100%;height:auto}
  canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .house,.board{cursor:pointer;outline:none}
  .house .lift{transition:transform .2s}
  .house:hover .lift,.house:focus-visible .lift{transform:translateY(-5px)}
  .house:focus-visible rect.ring,.board:focus-visible rect.ring{stroke:#ffd76a;stroke-width:3}
  .ring{fill:none;stroke:none}
  .house image{filter:drop-shadow(0 5px 5px #0008);transition:filter .2s}
  .house:hover image,.house:focus-visible image{filter:drop-shadow(0 0 9px #ffd36b) drop-shadow(0 5px 5px #0008)}
  .win,.gl{animation:glow 3.4s ease-in-out infinite}
  .gl{animation-delay:-1.1s}
  .tw{animation:tw 1.9s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:1}40%{opacity:.8}55%{opacity:.95}}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .ov{position:fixed;inset:0;background:#050a18c0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .ov[hidden]{display:none}
  .card{position:relative;width:min(380px,100%);max-height:90vh;overflow:auto;background:var(--cream);color:var(--ink);border:6px solid var(--wood);border-radius:12px;padding:20px;text-align:center;box-shadow:0 10px 40px #000a;animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .card h2{margin:0 0 12px;font-weight:normal;font-size:1.4rem}
  .card img{width:100%;max-height:300px;object-fit:contain;border-radius:8px;background:#fff;border:2px solid #d8c9a3}
  .card a{color:var(--red)}
  .card .go{display:inline-block;margin-top:12px;font-weight:bold}
  .card ol{text-align:left;margin:0;padding-left:1.4em;line-height:1.9}
  .x{position:absolute;top:4px;right:8px;border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--ink)}
  .hint{text-align:center;opacity:.6;font-size:.9rem;margin:0 12px 24px}
  @media (prefers-reduced-motion:reduce){.win,.gl,.tw,.sway{animation:none}}
</style>
</head>
<body>

const snowman=(x,y,k=1,f=1)=>`<g transform="translate(${x} ${y}) scale(${k*f} ${k})"><ellipse cy="0" rx="24" ry="4" fill="#000" opacity=".15"/><g class="sway"><circle cy="-12" r="15" fill="url(#ball)"/><circle cy="-34" r="11" fill="url(#ball)"/><circle cy="-51" r="8" fill="url(#ball)"/><rect x="-9" y="-67" width="18" height="10" fill="#222"/><rect x="-13" y="-59" width="26" height="3" fill="#222"/><rect x="-9" y="-60" width="18" height="2" fill="#b3261e"/><path d="M0-51L11-48L0-46Z" fill="#f08a24"/><circle cx="-3" cy="-53" r="1.1" fill="#111"/><circle cx="3" cy="-53" r="1.1" fill="#111"/><circle cy="-30" r="1.4" fill="#111"/><circle cy="-22" r="1.4" fill="#111"/><path d="M-10-36L-27-47M10-36L25-28" stroke="#6a4a2a" stroke-width="2.5" stroke-linecap="round"/><rect x="-11" y="-44" width="22" height="4.5" rx="2" fill="#c0392b"/></g></g>`;
const lamp=(x,y)=>`<g transform="translate(${x} ${y})"><circle class="gl" cy="-56" r="30" fill="url(#halo)"/><ellipse cy="2" rx="16" ry="4" fill="url(#halo)"/><rect x="-5" y="-4" width="10" height="6" rx="1" fill="#111"/><rect x="-1.8" y="-50" width="3.6" height="46" fill="#111"/><path d="M-7-50H7L5-66H-5Z" fill="#111"/><rect class="win" x="-4.5" y="-64" width="9" height="13" fill="url(#wg)"/><path d="M-6-66L0-73L6-66Z" fill="#111"/><circle cy="-30" r="6" fill="none" stroke="#1f6a3c" stroke-width="3"/><circle cx="0" cy="-24" r="2.2" fill="#d6332a"/></g>`;
const person=(x,y,coat,hat,k=1)=>`<g transform="translate(${x} ${y}) scale(${k})"><ellipse rx="9" ry="2.5" fill="#000" opacity=".2"/><path d="M-6 0L-5-22Q0-27 5-22L6 0Z" fill="${coat}"/><rect x="-4" y="-17" width="8" height="2" fill="#f5e6c8"/><circle cy="-30" r="4.6" fill="#f1c9a5"/><path d="M-5-31Q0-39 5-31Z" fill="${hat}"/><rect x="-5" y="-26" width="10" height="2.5" fill="#d6332a"/></g>`;
let fence=""; for(let n=0;n<9;n++) fence+=`<path d="M${410+n*10} 746V730l2-3 2 3V746Z" fill="#e9d9b8" stroke="#8a7650" stroke-width=".6"/>`;
fence+=`<path d="M407 734H500M407 741H500" stroke="#c9b690" stroke-width="2"/>`;
$("decor").innerHTML = tree(34,304,1.25)+tree(868,304,1.25)
  + tree(120,478,.85)+tree(215,440,.6)+tree(790,478,.85)+tree(690,440,.6)
  + tree(40,664,1.3)+tree(862,664,1.3)+tree(125,730,.9)+tree(775,730,.9)+tree(352,736,.75)+tree(560,736,.65)
  + lamp(172,462)+lamp(728,462)+lamp(385,730)+lamp(535,730)
  + snowman(215,508,1.05)+snowman(690,508,1,-1)+snowman(458,726,1.15)
  + person(212,334,"#3b5ea8","#c0392b",.9)+person(690,334,"#8a2d3a","#2f7d4f",.9)
  + person(420,736,"#3b5ea8","#c0392b",1)+person(496,736,"#8a2d3a","#2f7d4f",1)+person(439,738,"#c98b3a","#4c6fa8",.75)
  + fence;

// ---------- ice rink in the middle of the track ----------
const RX=150, RY=62, RCX=450, RCY=460;
let bulbs=""; for(let i=0;i<30;i++){const a=i/30*Math.PI*2; bulbs+=`<circle class="tw" style="animation-delay:${-(i%6)*.3}s" cx="${RCX+Math.cos(a)*(RX+4)}" cy="${RCY+Math.sin(a)*(RY+4)}" r="2.6" fill="${PAL[i%4]}"/>`;}
$("rink").innerHTML = `
  <ellipse cx="${RCX}" cy="${RCY+8}" rx="${RX+14}" ry="${RY+12}" fill="#000" opacity=".22"/>
  <ellipse cx="${RCX}" cy="${RCY}" rx="${RX+10}" ry="${RY+8}" fill="#f4f8ff" filter="url(#cotton)"/>
  <ellipse cx="${RCX}" cy="${RCY}" rx="${RX-8}" ry="${RY-8}" fill="url(#ice)" stroke="#fff" stroke-width="2"/>
  <ellipse cx="${RCX-30}" cy="${RCY-14}" rx="${RX*.55}" ry="${RY*.3}" fill="#fff" opacity=".35"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".7"><path d="M340 470Q430 440 560 462" stroke-width="1.3"/><path d="M360 448Q450 482 540 446" stroke-width="1.1"/><path d="M380 480Q450 462 520 478" stroke-width="1"/><path d="M395 436Q460 424 515 440" stroke-width="1"/><ellipse cx="450" cy="462" rx="70" ry="26" stroke-width=".9"/></g>
  <circle cx="450" cy="462" r="3" fill="#fff" opacity=".7"/>
  ${bulbs}`;

const SK=[
  {coat:"#c0392b",hat:"#f4f4f4",scarf:"#2f7d4f",rx:118,ry:36,sp:.55,ph:0},
  {coat:"#3b5ea8",hat:"#c0392b",scarf:"#ffd36b",rx:92,ry:28,sp:-.7,ph:2.1},
  {coat:"#2f7d4f",hat:"#ffd36b",scarf:"#c0392b",rx:60,ry:20,sp:.9,ph:4.2},
  {coat:"#8a5aa0",hat:"#f4f4f4",scarf:"#ffe9a8",rx:126,ry:40,sp:-.45,ph:3.3},
  {coat:"#e08a30",hat:"#3b5ea8",scarf:"#f4f4f4",rx:75,ry:24,sp:.62,ph:5.5}
];
$("skaters").innerHTML = SK.map(s=>`<g class="sk"><ellipse rx="8" ry="2.2" fill="#0a3a66" opacity=".28"/><path d="M-3 0V-9M3 0V-9" stroke="#2a2a33" stroke-width="2.6" stroke-linecap="round"/><path d="M-5-9L-4.5-19Q0-22 4.5-19L5-9Z" fill="${s.coat}"/><path d="M-4-18L-10-12M4-18L10-13" stroke="${s.coat}" stroke-width="2.2" stroke-linecap="round"/><rect x="-4.3" y="-21" width="8.6" height="2" fill="${s.scarf}"/><circle cy="-25" r="3.8" fill="#f1c9a5"/><path d="M-4-26Q0-33 4-26Z" fill="${s.hat}"/><path d="M-7 1.8H-1M1 1.8H7" stroke="#e6edf7" stroke-width="1.5" stroke-linecap="round"/></g>`).join("");
const skEls=[...document.querySelectorAll(".sk")];
function skate(t){
  skEls.forEach((el,i)=>{
    const s=SK[i], a=s.ph+t/1000*s.sp, vx=-Math.sin(a)*s.rx*Math.sign(s.sp), wob=Math.sin(t/260+i)*1.2;
    const x=RCX+Math.cos(a)*s.rx, y=RCY+2+Math.sin(a)*s.ry;
    el.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${wob.toFixed(1)}) scale(${vx<0?-1.05:1.05} 1.05)`);
  });
}
skate(0);

// ---------- train ----------
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const track = $("track"), L = track.getTotalLength();
const CARS = [["#2c6fa8","#1c4a73"],["#2f7d4f","#1d5234"],["#c8963a","#8a6220"]];
$("train").innerHTML = `<g class="car">
  <circle cx="20" cy="-12" r="16" fill="url(#halo)"/>
  <rect x="-22" y="-27" width="14" height="23" rx="1.5" fill="#b3261e"/><rect x="-24" y="-29" width="18" height="4" fill="#222"/><rect x="-19" y="-22" width="8" height="8" fill="url(#wg)"/>
  <rect x="-8" y="-18" width="28" height="13" rx="6" fill="#25262d"/><rect x="-8" y="-12" width="28" height="2" fill="#d6a846"/>
  <rect x="10" y="-27" width="5" height="10" fill="#25262d"/><path d="M8.5-27H16.5L18-30H7Z" fill="#111"/><circle cx="1" cy="-20" r="3.6" fill="#d6a846"/>
  <circle cx="21" cy="-12" r="3" fill="#fff7c0"/><path d="M20-4H25L22-7Z" fill="#8a2d22"/>
  <g fill="#111" stroke="#b3261e" stroke-width="1.5"><circle cx="-14" cy="-4" r="4.6"/><circle cx="0" cy="-4" r="4.6"/><circle cx="14" cy="-4" r="4.6"/></g></g>`
  + CARS.map(([c,d])=>`<g class="car"><rect x="-17" y="-21" width="34" height="17" rx="2" fill="${c}" stroke="${d}" stroke-width="1.5"/><rect x="-17" y="-21" width="34" height="3" fill="#000" opacity=".25"/><g fill="url(#wg)"><rect x="-12" y="-16" width="7" height="6"/><rect x="-3.5" y="-16" width="7" height="6"/><rect x="5" y="-16" width="7" height="6"/></g><g fill="#111"><circle cx="-9" cy="-3.5" r="4"/><circle cx="9" cy="-3.5" r="4"/></g></g>`).join("");
const cars = [...document.querySelectorAll(".car")];
let pos = 0, mode = "idle", target = 0, last = 0;

function place(){
  cars.forEach((el,i)=>{
    const l = (pos - i*40 + L*2) % L;
    const p = track.getPointAtLength(l), a = track.getPointAtLength((l+3)%L), b = track.getPointAtLength((l-3+L)%L);
    let ang = Math.atan2(a.y-b.y, a.x-b.x)*180/Math.PI, flip = Math.abs(ang)>90 ? -1 : 1;
    el.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${ang}) scale(1 ${flip})`);
  });
}
function nearest(x,y){
  let best=0, bd=1e9;
  for(let l=0;l<L;l+=4){ const p=track.getPointAtLength(l), d=(p.x-x)**2+(p.y-y)**2; if(d<bd){bd=d;best=l;} }
  return best;
}
function frame(t){
  const dt = Math.min((t-last)/1000, .05); last = t;
  if(mode==="idle") pos = (pos + 50*dt) % L;
  else if(mode==="going"){
    const rem = (target - pos + L) % L;
    const step = Math.min(rem, Math.min(260, 40+rem*1.6)*dt);
    pos = (pos + step) % L;
    if(rem - step < .5){ pos = target; mode = "stopped"; showGift(openIdx); }
  }
  place(); if(!REDUCED) skate(t); requestAnimationFrame(frame);
}

// ---------- popups ----------
const ov = $("ov"), body = $("body");
let openIdx = -1;
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220"><rect width="300" height="220" fill="#f3e6c4"/><rect x="100" y="90" width="100" height="80" fill="#b3261e"/><rect x="90" y="75" width="120" height="25" fill="#d44a3f"/><rect x="144" y="75" width="12" height="95" fill="#ffd36b"/><text x="150" y="205" text-anchor="middle" font-family="Georgia" font-size="14" fill="#6b4a20">Add your picture</text></svg>');
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function showGift(i){
  const g = GIFTS[i];
  body.innerHTML = `<h2 id="ttl">${esc(g.name)}</h2><a href="${esc(g.link)}" target="_blank" rel="noopener"><img src="${esc(g.image)}" alt="${esc(g.name)}" onerror="this.onerror=null;this.src=PLACEHOLDER"></a><a class="go" href="${esc(g.link)}" target="_blank" rel="noopener">View this gift</a>`;
  ov.hidden = false; ov.querySelector(".x").focus();
}
function showList(){
  openIdx = -1;
  body.innerHTML = `<h2 id="ttl">Wish list</h2><ol>${GIFTS.map(g=>`<li><a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.name)}</a></li>`).join("")}</ol>`;
  ov.hidden = false; ov.querySelector(".x").focus();
}
function close(){ ov.hidden = true; if(mode==="stopped") mode = "idle"; }

function pick(i){
  openIdx = i;
  const h = HOUSES[i];
  target = nearest(h.x, h.y - h.w*h.r*.5);
  ov.hidden = true; mode = "going";
}
document.querySelectorAll(".house").forEach(h=>{
  const go = ()=>pick(+h.dataset.i);
  h.addEventListener("click", go);
  h.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
});
const st = $("station");
st.addEventListener("click", showList);
st.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();showList();} });
ov.addEventListener("click", e=>{ if(e.target===ov) close(); });
ov.querySelector(".x").addEventListener("click", close);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !ov.hidden) close(); });

// ---------- snow ----------
const cv = $("snow"), cx = cv.getContext("2d");
let flakes = [];
function fit(){ cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
fit(); addEventListener("resize", fit);
flakes = Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2+.8,v:Math.random()*.0007+.0003,d:Math.random()*6}));
function snow(t){
  cx.clearRect(0,0,cv.width,cv.height); cx.fillStyle = "rgba(255,255,255,.85)";
  for(const f of flakes){
    f.y += f.v*16; if(f.y>1){f.y=-.02;f.x=Math.random();}
    const x = (f.x + Math.sin(t/1500+f.d)*.01)*cv.width;
    cx.beginPath(); cx.arc(x, f.y*cv.height, f.r*cv.width/900, 0, 7); cx.fill();
  }
  requestAnimationFrame(snow);
}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(snow);
requestAnimationFrame(t=>{last=t;frame(t);});
</script>
</body>
</html>
